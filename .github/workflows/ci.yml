
name: Savannah Clinic API - CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: savannah_clinic_test
          POSTGRES_USER: savannah_user
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U savannah_user -d savannah_clinic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: savannah_clinic_test
      DB_USER: savannah_user
      DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run automated tests
        run: python -m pytest tests/ -v

  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure deployment SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/savannah_clinic_deploy
          chmod 600 ~/.ssh/savannah_clinic_deploy

          ssh-keygen -y -P "" -f ~/.ssh/savannah_clinic_deploy > /dev/null
          echo "Deployment private key is valid"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy FastAPI application
        run: |
          ssh \
            -i ~/.ssh/savannah_clinic_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            savannah@217.76.55.48 'bash -se' <<'REMOTE'

          set -euo pipefail

          cd /opt/savannah-clinic-api

          echo "Retrieving latest code..."
          git fetch origin main
          git merge --ff-only origin/main

          echo "Installing Python dependencies..."
          .venv/bin/python -m pip install -r requirements.txt

          echo "Applying database migrations..."
          DB_NAME=savannah_clinic .venv/bin/python -m alembic upgrade head

          echo "Restarting Savannah Clinic API..."
          sudo -n /usr/bin/systemctl restart savannah-clinic.service

          echo "Checking application health..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8090/health

          echo
          echo "Deployment completed successfully."

          REMOTE

      - name: Verify public HTTPS endpoint
        run: |
          curl --fail --silent --show-error \
            https://clinic.kashflowsacco.co.ke/health

